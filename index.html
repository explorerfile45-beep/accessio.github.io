<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access IO Digital Store</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: auto;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .btn {
            display: inline-block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            border-radius: 8px;
            font-weight: bold;
            width: 80%;
            max-width: 300px;
            transition: 0.3s;
        }
        .btn-wa {
            background-color: #00a884; /* WhatsApp Green */
        }
        .btn-wa:hover {
            background-color: #008f6f;
        }
        .btn-tg {
            background-color: #0088cc; /* Telegram Blue */
        }
        .btn-tg:hover {
            background-color: #006699;
        }
        .btn-fb {
            background-color: #1877F2; /* Facebook Blue */
        }
        .btn-fb:hover {
            background-color: #145dbf;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Access IO Digital Store 🚀</h1>
        <p>Your trusted source for legit Microsoft licenses, AI subscriptions, and premium digital products at the best prices.</p>
        
        <div class="btn-group">
            <!-- WhatsApp Channel Link -->
            <a href="https://whatsapp.com/channel/0029VbDhHHS0gcfRUXsGD92X" class="btn btn-wa" target="_blank">🛒 Order via WhatsApp</a>
            
            <!-- Telegram Contact Link -->
            <a href="https://t.me/EDS_DigitalShop" class="btn btn-tg" target="_blank">✈️ Message on Telegram</a>

            <!-- Facebook Page Link -->
            <a href="https://web.facebook.com/AccessIOPH/" class="btn btn-fb" target="_blank">📘 Visit our Facebook Page</a>
        </div>
    </div>

</body>
</html>
